name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

# One deploy per PR at a time; a newer push supersedes an in-progress deploy.
concurrency:
  group: preview-sections-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup-preview-service:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_STAGING_SA_KEY }}

      - name: Delete Cloud Run Preview Service
        run: |
          gcloud run services delete preview-sections-pr-${{ github.event.number }} \
            --region=us-west1 \
            --quiet || true

  deploy-preview-service:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_STAGING_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run (Preview)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: preview-sections-pr-${{ github.event.number }}
          region: us-west1
          source: .
          flags: '--allow-unauthenticated --service-account=sections-run@staging-cdss-web-apps.iam.gserviceaccount.com --add-cloudsql-instances=staging-cdss-web-apps:us-west1:staging-cdss-web-apps-2 --max-instances=3'
          # Previews behave like the monorepo's PR deployments: course key "cs61a"
          # (data moved to the staging DB) backed by the bCourses test course 1521247.
          env_vars: |
            FLASK_ENV=staging
            CANVAS_SERVER_URL=https://bcourses.berkeley.edu/
            CANVAS_COURSE_ID=1521247
            COURSE_KEY=cs61a
            COURSE_NAME=Sections preview (PR ${{ github.event.number }})
            ADMIN_OVERRIDE_CANVAS_COURSE_ID=1549197
          secrets: |
            CANVAS_CLIENT_ID=sections-canvas-client-id:latest
            CANVAS_CLIENT_SECRET=sections-canvas-client-secret:latest
            DATABASE_URL=sections-database-url:latest
            SECRET_KEY=sections-secret-key:latest

      - name: Allow Unauthenticated Access (allUsers)
        run: |
          gcloud run services add-iam-policy-binding preview-sections-pr-${{ github.event.number }} \
            --region=us-west1 \
            --member="allUsers" \
            --role="roles/run.invoker"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Staging Preview Deployed!**\n\nURL: ${{ steps.deploy.outputs.url }}'
            })
